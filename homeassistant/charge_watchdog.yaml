# Battery charge watchdog for the GivEnergy Gen1 + BMS emulator.
#
# The Gen1 drops into standby if it is told to stop at night and does not
# resume by itself; only an inverter restart brings it back. This catches
# that within ~10 minutes instead of the next morning.
#
# Install: Settings > Automations & Scenes > Create automation > three-dot
# menu > Edit in YAML, paste this, save.
#
# CHECK THESE ENTITY IDs FIRST (Developer Tools > States, search the name):
#   sensor.givtcp_sd2246g724_battery_power  "GivTCP ... Battery Power"
#   sensor.house_battery_state_of_charge     "House Battery State of charge"
#   binary_sensor.cheap_rate                 "Cheap  Rate"
#   switch.enable_charge_schedule            "Enable charge schedule"
#   switch.reboot_inverter                   "Reboot Inverter"
#   notify.mobile_app_pixel_8                your phone's notify service

alias: Battery charge watchdog
description: >-
  Cheap rate on, charge schedule on, battery below 95% but battery power has
  sat at ~0 W for 10 minutes: alert, and during the main 23:30-05:30 slot
  restart the inverter. Re-checks 10 minutes after the restart.
mode: single
max_exceeded: silent

triggers:
  - trigger: numeric_state
    entity_id: sensor.givtcp_sd2246g724_battery_power
    above: -50
    below: 50
    for: "00:10:00"

conditions:
  - condition: state
    entity_id: binary_sensor.cheap_rate
    state: "on"
  - condition: state
    entity_id: switch.enable_charge_schedule
    state: "on"
  - condition: numeric_state
    entity_id: sensor.house_battery_state_of_charge
    below: 95

actions:
  - action: notify.mobile_app_pixel_8
    data:
      title: Battery not charging
      message: >-
        Cheap rate is on but the battery has been at
        {{ states('sensor.givtcp_sd2246g724_battery_power') }} W for 10 minutes
        (SoC {{ states('sensor.house_battery_state_of_charge') }}%).

  # Only restart the inverter automatically in the main overnight slot.
  # Octopus extra dispatches can be on while the inverter's own charge slot
  # is not, and the battery then idles legitimately - alert only.
  - if:
      - condition: time
        after: "23:30:00"
        before: "05:30:00"
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.reboot_inverter
      - action: notify.mobile_app_pixel_8
        data:
          title: Inverter restarted
          message: Restarted the inverter to clear standby. Checking again in 10 minutes.
      - delay: "00:10:00"
      - if:
          - condition: numeric_state
            entity_id: sensor.givtcp_sd2246g724_battery_power
            above: -50
            below: 50
        then:
          - action: notify.mobile_app_pixel_8
            data:
              title: Still not charging after restart
              message: >-
                Battery power is still
                {{ states('sensor.givtcp_sd2246g724_battery_power') }} W.
                Check the emulator: http://192.168.1.83/health
        else:
          - action: notify.mobile_app_pixel_8
            data:
              title: Charging resumed
              message: >-
                Battery now at
                {{ states('sensor.givtcp_sd2246g724_battery_power') }} W
                after the restart.

  # Hold the run for 30 minutes so a slow recovery can't trigger a second
  # restart straight away (mode: single ignores triggers while running).
  - delay: "00:30:00"
